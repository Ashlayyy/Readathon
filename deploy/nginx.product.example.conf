# Example nginx layout for multi-tenant Readathon.
# Adjust SSL, upstreams, and domain names for your host.

upstream readathon_api {
    server 127.0.0.1:3001;
}

# --- Option A (recommended): Node serves both SPAs ---
# Point product.com, www, bookbaddies.net, and *.product.com at the API.
# The Hono app picks product/dist vs frontend/dist from the Host header.
#
# server {
#     listen 443 ssl http2;
#     server_name product.com www.product.com bookbaddies.net www.bookbaddies.net *.product.com;
#     location / {
#         proxy_pass http://readathon_api;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }

# --- Option B: split static + API ---

# Marketing + host panel
server {
    listen 443 ssl http2;
    server_name product.com www.product.com;

    root /var/www/readathon/product/dist;
    index index.html;

    location /api/ {
        proxy_pass http://readathon_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://readathon_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Players — Book Baddies (default tenant)
server {
    listen 443 ssl http2;
    server_name bookbaddies.net www.bookbaddies.net;

    root /var/www/readathon/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://readathon_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://readathon_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Players — path tenants on product apex (/e/:slug) OR subdomain tenants
server {
    listen 443 ssl http2;
    server_name *.product.com;

    root /var/www/readathon/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://readathon_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://readathon_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API-only host (optional)
server {
    listen 443 ssl http2;
    server_name api.product.com;

    location / {
        proxy_pass http://readathon_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
